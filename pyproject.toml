[project]
name = "firebrief"
version = "0.1.0"
description = "Cited answers to UK fire safety guidance questions, with enterprise controls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "FSL-1.1-ALv2" }
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "anyio>=4.6.0",
    "hypothesis>=6.112.4",
    "import-linter>=2.1",
    "pip-licenses>=5.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.381",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firebrief"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["firebrief"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportDeprecated = "error"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["firebrief"]

[[tool.importlinter.contracts]]
name = "Budget and LLM layers are independent"
type = "independence"
modules = ["firebrief.budget", "firebrief.llm"]

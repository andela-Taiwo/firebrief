# A retrieval evaluation set: question -> the heading that should answer it.
# Small on purpose, checked in, and grown as the corpus grows. It is a smoke gate
# for plumbing, not a quality claim: six questions and a bag-of-words embedder.
# The real quality gate belongs to a live evaluation with the real corpus.

[[queries]]
question = "How long can a dead end be?"
expected = "Escape routes"

[[queries]]
question = "Do flat entrance doors need to be self-closing?"
expected = "Fire doors"

[[queries]]
question = "What standard covers detection systems?"
expected = "Detection"

[[queries]]
question = "Doors that are fire resisting"
expected = "Fire doors"

[[queries]]
question = "BS 5839 maintenance"
expected = "Detection"

[[queries]]
question = "Length of dead ends"
expected = "Escape routes"

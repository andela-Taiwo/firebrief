# A retrieval evaluation set: question -> the heading path that should answer it.
# Small on purpose, checked in, and grown as the corpus grows. The number it
# produces is reported, not just asserted.

[[queries]]
question = "How long can a dead end be?"
expected = "Escape routes"

[[queries]]
question = "Do flat entrance doors need to be self-closing?"
expected = "Fire doors"

[[queries]]
question = "Must fire door signs be visible?"
expected = "Signage"

[[queries]]
question = "Doors that are fire resisting"
expected = "Fire doors"

[[queries]]
question = "Signs that are obstructed"
expected = "Signage"

[[queries]]
question = "Length of dead ends"
expected = "Escape routes"

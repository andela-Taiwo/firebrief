# A small labelled set over the checked-in fixture corpus.
# It exists to prove the harness and its metrics, not to claim quality.

[[cases]]
id = "dead-ends"
question = "How long can a dead end be?"
expect = "answer"
heading = "Escape routes"
terms = ["thirty metres"]

[[cases]]
id = "doors-self-closing"
question = "Do flat entrance doors need to be self-closing?"

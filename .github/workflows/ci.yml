name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (lockfile enforced)
        run: uv sync --locked --all-groups

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Types (deprecations are errors)
        run: make types

      - name: Module boundaries
        run: make boundaries

      - name: Dependency licences
        run: make licenses

      - name: Secret scan (full history)
        run: make secrets

      - name: Start services (same Compose file as local)
        run: docker compose up -d --wait

      - name: Migrations round-trip and drift check
        run: make db-roundtrip

      - name: Tests (real PostgreSQL, not SQLite)
        run: make test

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image, prove it imports and runs non-root
        run: make docker-smoke

name: firebrief

# Images are pinned by digest. When pgvector arrives with the corpus feature
# (F4), postgres is replaced by pgvector/pgvector:pg16 at a pinned digest.
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: firebrief
      POSTGRES_PASSWORD: firebrief_dev
      POSTGRES_DB: firebrief_dev
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55433:5432"
    # Healthcheck over TCP, not the unix socket: during first-start init the
    # server listens on the socket before the init scripts have finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U firebrief -d firebrief_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
